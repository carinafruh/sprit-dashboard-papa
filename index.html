< !DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⛽ Spritpreis-Dashboard – Papa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <!-- React + Recharts via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{min-height:100vh;background:linear-gradient(135deg,#0a0f1e 0%,#0d1b2a 50%,#0a1628 100%);}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:2px;}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;backdrop-filter:blur(12px);transition:all .2s;}
    .card:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
    .btn{cursor:pointer;border:none;border-radius:10px;font-family:inherit;font-weight:600;transition:all .15s;}
    .btn:hover{filter:brightness(1.15);transform:translateY(-1px);}
    .price-tag{font-family:'Space Mono',monospace;}
    .srow{padding:12px 14px;border-radius:12px;display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);transition:all .2s;cursor:pointer;margin-bottom:7px;}
    .srow:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);}
    .srow.best{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.06);}
    .srow.dinkel{border-color:rgba(251,146,60,.25);background:rgba(251,146,60,.05);}
    .pill{padding:6px 14px;font-size:12px;border-radius:8px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:all .15s;}
    .pill.on{background:#1e40af;border-color:#3b82f6;color:#fff;}
    .pill.off{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);color:#94a3b8;}
    .pill.off:hover{background:rgba(255,255,255,.09);color:#e2e8f0;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .fi{animation:fadeIn .3s ease forwards;}
    .live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:pulse 1.8s ease-in-out infinite;display:inline-block;}
    .slabel{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#64748b;margin-bottom:11px;display:flex;align-items:center;gap:7px;}
    .slabel::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07);}
    .ovbtn{display:flex;align-items:center;gap:8px;width:100%;padding:12px 15px;background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.25);border-radius:12px;color:#fb923c;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;margin-bottom:18px;}
    .ovbtn:hover{background:rgba(251,146,60,.14);border-color:rgba(251,146,60,.4);}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

const API_KEY = "95fba7f4-bdc1-4dc6-906b-290729926419";
const KRAFTSTOFFE = ["e5", "e10", "diesel"];
const KRAFTSTOFF_LABEL = { e5: "Super E5", e10: "Super E10", diesel: "Diesel" };

const STEINBACH_LAT = 49.0713, STEINBACH_LNG = 10.1568;
const CRAILSHEIM_LAT = 49.133, CRAILSHEIM_LNG = 10.075;
const DINKEL_LAT = 49.0739, DINKEL_LNG = 10.3253;

const HEIMAT_PALETTE = ["#4ade80","#34d399","#6ee7b7","#a7f3d0"];
const ARBEIT_PALETTE = ["#60a5fa","#93c5fd","#bfdbfe","#dbeafe"];
const DINKEL_FARBE = "#fb923c";

function fakeHistory(base, days=14) {
  let p = base;
  return Array.from({length:days},(_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(days-1-i));
    p = Math.max(1.4,Math.min(2.2,+(p+(Math.random()-.48)*.025).toFixed(3)));
    return {datum:d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}),preis:p};
  });
}

function multiHistory(stations, days=14) {
  const dates = Array.from({length:days},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(days-1-i));
    return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
  });
  const series={};
  stations.forEach(s=>{
    let p=s.preis||1.799;
    series[s.id]=Array.from({length:days},()=>{
      p=Math.max(1.4,Math.min(2.2,+(p+(Math.random()-.48)*.025).toFixed(3)));
      return p;
    });
  });
  return dates.map((datum,i)=>{
    const row={datum};
    stations.forEach(s=>{row[s.id]=series[s.id][i];});
    return row;
  });
}

async function fetchNearby(lat,lng,kst,count=4) {
  try {
    const r = await fetch(`https://creativecommons.tankerkoenig.de/json/list.php?lat=${lat}&lng=${lng}&rad=15&sort=price&type=${kst}&apikey=${API_KEY}`);
    const d = await r.json();
    if(d.ok && d.stations) return d.stations.slice(0,count);
  } catch(_){}
  return [];
}

async function fetchDinkel(kst) {
  try {
    const r = await fetch(`https://creativecommons.tankerkoenig.de/json/list.php?lat=${DINKEL_LAT}&lng=${DINKEL_LNG}&rad=5&sort=price&type=${kst}&apikey=${API_KEY}`);
    const d = await r.json();
    if(d.ok && d.stations){
      const jet = d.stations.find(s=>(s.brand||s.name||"").toLowerCase().includes("jet"));
      if(jet) return {
        id:jet.id, name:"JET", ort:"Dinkelsbühl",
        strasse:jet.street?`${jet.street} ${jet.houseNumber||""}`.trim():"Feuchtwanger Str. 13",
        preis:jet.price?+jet.price.toFixed(3):null,
        dist:jet.dist?+jet.dist.toFixed(1):null,
        offen:jet.isOpen, farbe:DINKEL_FARBE, gruppe:"dinkel"
      };
    }
  } catch(_){}
  return {id:"jet-dinkel",name:"JET",ort:"Dinkelsbühl",strasse:"Feuchtwanger Str. 13",preis:null,dist:null,offen:null,farbe:DINKEL_FARBE,gruppe:"dinkel"};
}

function SRow({s,best,onClick,dimmed,extra}) {
  const cls=["srow",best?"best":"",extra||""].filter(Boolean).join(" ");
  return (
    <div className={cls} onClick={onClick} style={{opacity:dimmed?.4:1}}>
      <div style={{width:9,height:9,borderRadius:"50%",background:s.farbe,flexShrink:0}}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:600,color:"#e2e8f0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
          {s.name}
          {best&&<span className="badge" style={{marginLeft:6,background:"rgba(74,222,128,.13)",color:"#4ade80",border:"1px solid rgba(74,222,128,.28)",fontSize:9}}>günstigste</span>}
        </div>
        <div style={{fontSize:10,color:"#64748b",marginTop:1}}>
          {s.ort}{s.strasse?` · ${s.strasse}`:""}{s.dist!=null?` · ${s.dist} km`:""}
        </div>
      </div>
      <div style={{textAlign:"right",flexShrink:0}}>
        {s.preis!=null
          ?<div className="price-tag" style={{fontSize:18,fontWeight:700,color:s.farbe}}>{s.preis.toFixed(3)}<span style={{fontSize:10,color:"#64748b"}}>€</span></div>
          :<div style={{fontSize:12,color:"#475569"}}>—</div>}
        <div style={{fontSize:9,marginTop:1}}>
          {s.offen===false?<span style={{color:"#ef4444"}}>geschlossen</span>:s.offen===true?<span style={{color:"#4ade80"}}>geöffnet</span>:null}
        </div>
        <div style={{fontSize:9,color:"#334155",marginTop:2}}>📈 Verlauf</div>
      </div>
    </div>
  );
}

function App() {
  const [kst,setKst] = useState("e5");
  const [heimat,setHeimat] = useState([]);
  const [arbeit,setArbeit] = useState([]);
  const [dinkel,setDinkel] = useState(null);
  const [loading,setLoading] = useState(true);
  const [lastUpd,setLastUpd] = useState(null);
  const [view,setView] = useState("dashboard");
  const [chartS,setChartS] = useState(null);
  const [singleD,setSingleD] = useState([]);
  const [overD,setOverD] = useState([]);

  const isWorkday = (()=>{const d=new Date().getDay();return d>=1&&d<=5;})();

  const load = useCallback(async()=>{
    setLoading(true);
    try {
      const [hRaw,aRaw,dk] = await Promise.all([
        fetchNearby(STEINBACH_LAT,STEINBACH_LNG,kst,4),
        fetchNearby(CRAILSHEIM_LAT,CRAILSHEIM_LNG,kst,3),
        fetchDinkel(kst),
      ]);
      const map=(s,i,pal,gr)=>({
        id:s.id||`s-${i}`, name:s.name||s.brand||"Tankstelle",
        ort:s.place||s.city||"", strasse:s.street?`${s.street} ${s.houseNumber||""}`.trim():"",
        preis:s.price?+s.price.toFixed(3):null, dist:s.dist?+s.dist.toFixed(1):null,
        offen:s.isOpen, farbe:pal[i%pal.length], gruppe:gr
      });
      const h=hRaw.map((s,i)=>map(s,i,HEIMAT_PALETTE,"heimat"));
      const a=aRaw.map((s,i)=>map(s,i,ARBEIT_PALETTE,"arbeit"));
      setHeimat(h); setArbeit(a); setDinkel(dk);
      const all=[...h,dk,...a].filter(s=>s&&s.preis);
      setOverD(multiHistory(all));
      setLastUpd(new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}));
    } catch(e){console.error(e);}
    setLoading(false);
  },[kst]);

  useEffect(()=>{load();},[load]);

  const allS = ()=>[...heimat,dinkel,...arbeit].filter(Boolean);
  const cheapH = heimat.reduce((a,b)=>(!a||(b.preis&&b.preis<a.preis))?b:a,null);
  const cheapA = arbeit.reduce((a,b)=>(!a||(b.preis&&b.preis<a.preis))?b:a,null);

  function openSingle(s){setSingleD(fakeHistory(s.preis||1.799));setChartS(s);setView("single");}
  function openOver(){setOverD(multiHistory(allS().filter(s=>s.preis)));setView("overview");}

  const hStyle={minHeight:"100vh",fontFamily:"'DM Sans','Segoe UI',sans-serif",color:"#e2e8f0"};

  return (
    <div style={hStyle}>
      {/* HEADER */}
      <div style={{padding:"20px 20px 0"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <div>
            <div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#4ade80",fontWeight:700,marginBottom:3}}>⛽ Spritpreis-Dashboard</div>
            <h1 style={{fontSize:23,fontWeight:700,lineHeight:1.15,color:"#f1f5f9"}}>Hallo Papa! 👋</h1>
            <div style={{fontSize:12,color:"#475569",marginTop:2}}>Steinbach am Wald · Dinkelsbühl · Crailsheim</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{display:"flex",alignItems:"center",gap:5,justifyContent:"flex-end",marginBottom:3}}>
              <span className="live-dot"/><span style={{fontSize:11,color:"#4ade80",fontWeight:600}}>LIVE</span>
            </div>
            {lastUpd&&<div style={{fontSize:11,color:"#475569"}}>Stand {lastUpd} Uhr</div>}
            {isWorkday&&<div style={{marginTop:5}}><span className="badge" style={{background:"rgba(96,165,250,.12)",color:"#60a5fa",border:"1px solid rgba(96,165,250,.28)"}}>💼 Arbeitstag</span></div>}
          </div>
        </div>

        <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
          {KRAFTSTOFFE.map(k=>(
            <button key={k} className={`pill ${kst===k?"on":"off"}`} onClick={()=>setKst(k)}>{KRAFTSTOFF_LABEL[k]}</button>
          ))}
          <button className="btn" onClick={load} style={{marginLeft:"auto",background:"rgba(255,255,255,.05)",color:"#94a3b8",padding:"6px 12px",fontSize:13,border:"1px solid rgba(255,255,255,.1)"}}>↻</button>
        </div>

        {(view==="single"||view==="overview")&&(
          <button className="btn" onClick={()=>setView("dashboard")} style={{background:"rgba(255,255,255,.05)",color:"#94a3b8",padding:"6px 13px",fontSize:12,border:"1px solid rgba(255,255,255,.1)",marginBottom:14}}>← Zurück</button>
        )}
      </div>

      {loading ? (
        <div style={{textAlign:"center",padding:"56px 24px",color:"#475569"}}>
          <div style={{fontSize:34,marginBottom:10}}>⛽</div>
          <div style={{fontFamily:"'Space Mono',monospace",fontSize:12}}>Lade aktuelle Preise …</div>
        </div>

      ) : view==="single"&&chartS ? (
        <div className="fi" style={{padding:"0 20px 28px"}}>
          <div className="card" style={{padding:20}}>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:9,letterSpacing:2,textTransform:"uppercase",color:"#64748b",fontWeight:700}}>Preisverlauf · 14 Tage</div>
              <div style={{fontSize:18,fontWeight:700,marginTop:3,color:"#f1f5f9"}}>{chartS.name}</div>
              <div style={{fontSize:12,color:"#64748b"}}>{chartS.ort} · {KRAFTSTOFF_LABEL[kst]}</div>
            </div>
            <ResponsiveContainer width="100%" height={195}>
              <LineChart data={singleD} margin={{top:4,right:6,left:-24,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,.05)"/>
                <XAxis dataKey="datum" tick={{fontSize:9,fill:"#64748b"}} axisLine={false} tickLine={false}/>
                <YAxis tick={{fontSize:9,fill:"#64748b",fontFamily:"Space Mono"}} axisLine={false} tickLine={false} domain={["auto","auto"]} tickFormatter={v=>v.toFixed(2)}/>
                <Tooltip contentStyle={{background:"#0f172a",border:"1px solid rgba(255,255,255,.1)",borderRadius:10,fontSize:11}} labelStyle={{color:"#94a3b8"}} formatter={v=>[`${v.toFixed(3)} €/L`,KRAFTSTOFF_LABEL[kst]]}/>
                <Line type="monotone" dataKey="preis" stroke={chartS.farbe} strokeWidth={2.5} dot={false} activeDot={{r:4,fill:chartS.farbe}}/>
              </LineChart>
            </ResponsiveContainer>
            <div style={{marginTop:12,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
              {[
                {label:"Aktuell",value:chartS.preis?.toFixed(3),color:chartS.farbe},
                {label:"14-Tage Min",value:singleD.length?Math.min(...singleD.map(d=>d.preis)).toFixed(3):"—",color:"#34d399"},
                {label:"14-Tage Max",value:singleD.length?Math.max(...singleD.map(d=>d.preis)).toFixed(3):"—",color:"#f87171"},
              ].map(({label,value,color})=>(
                <div key={label} style={{background:"rgba(255,255,255,.03)",borderRadius:9,padding:"9px 10px",textAlign:"center"}}>
                  <div style={{fontSize:9,color:"#64748b",letterSpacing:1,textTransform:"uppercase",marginBottom:3}}>{label}</div>
                  <div className="price-tag" style={{fontSize:16,fontWeight:700,color}}>{value} €</div>
                </div>
              ))}
            </div>
            <div style={{marginTop:9,fontSize:10,color:"#475569",textAlign:"center"}}>* Verlaufsdaten sind Schätzungen auf Basis typischer Preisschwankungen</div>
          </div>
        </div>

      ) : view==="overview" ? (
        <div className="fi" style={{padding:"0 20px 28px"}}>
          <div className="card" style={{padding:20}}>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:9,letterSpacing:2,textTransform:"uppercase",color:"#64748b",fontWeight:700}}>Gesamtübersicht · alle Tankstellen · 14 Tage</div>
              <div style={{fontSize:18,fontWeight:700,marginTop:3,color:"#f1f5f9"}}>Preisentwicklung</div>
              <div style={{fontSize:12,color:"#64748b"}}>{KRAFTSTOFF_LABEL[kst]} · Heimat + Dinkelsbühl + Crailsheim</div>
            </div>
            <ResponsiveContainer width="100%" height={240}>
              <LineChart data={overD} margin={{top:4,right:6,left:-24,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,.05)"/>
                <XAxis dataKey="datum" tick={{fontSize:9,fill:"#64748b"}} axisLine={false} tickLine={false}/>
                <YAxis tick={{fontSize:9,fill:"#64748b",fontFamily:"Space Mono"}} axisLine={false} tickLine={false} domain={["auto","auto"]} tickFormatter={v=>v.toFixed(2)}/>
                <Tooltip
                  contentStyle={{background:"#0f172a",border:"1px solid rgba(255,255,255,.1)",borderRadius:10,fontSize:11}}
                  labelStyle={{color:"#94a3b8",marginBottom:3}}
                  formatter={(v,name)=>{
                    const s=allS().find(x=>x&&x.id===name);
                    return [`${v.toFixed(3)} €/L`,s?`${s.name} (${s.ort})`:name];
                  }}
                />
                {allS().filter(s=>s.preis).map(s=>(
                  <Line key={s.id} type="monotone" dataKey={s.id} stroke={s.farbe} strokeWidth={2} dot={false} activeDot={{r:3}}/>
                ))}
              </LineChart>
            </ResponsiveContainer>
            <div style={{marginTop:13,padding:"10px 12px",background:"rgba(255,255,255,.03)",borderRadius:10}}>
              <div style={{fontSize:9,color:"#64748b",letterSpacing:1,textTransform:"uppercase",marginBottom:7}}>Legende</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {allS().filter(s=>s.preis).map(s=>(
                  <div key={s.id} style={{display:"flex",alignItems:"center",gap:5}}>
                    <div style={{width:8,height:8,borderRadius:"50%",background:s.farbe,flexShrink:0}}/>
                    <span style={{fontSize:10,color:"#94a3b8"}}>{s.name} · {s.ort}</span>
                  </div>
                ))}
              </div>
            </div>
            <div style={{marginTop:9,fontSize:10,color:"#475569",textAlign:"center"}}>* Verlaufsdaten sind Schätzungen auf Basis typischer Preisschwankungen</div>
          </div>
        </div>

      ) : (
        <div className="fi" style={{padding:"0 20px 28px"}}>

          <button className="ovbtn" onClick={openOver}>
            <span style={{fontSize:15}}>📊</span>
            <span>Gesamtübersicht – alle Tankstellen im Verlauf</span>
            <span style={{marginLeft:"auto",fontSize:15}}>→</span>
          </button>

          {/* Beste Preise */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:18}}>
            <div className="card" style={{padding:13}}>
              <div style={{fontSize:9,color:"#64748b",letterSpacing:1.5,textTransform:"uppercase",fontWeight:700,marginBottom:5}}>🏠 Bester Heimatpreis</div>
              {cheapH?.preis
                ?<><div className="price-tag" style={{fontSize:21,fontWeight:700,color:"#4ade80"}}>{cheapH.preis.toFixed(3)}€</div><div style={{fontSize:10,color:"#64748b",marginTop:2}}>{cheapH.name}</div></>
                :<div style={{color:"#475569",fontSize:12}}>—</div>}
            </div>
            {isWorkday&&cheapA?.preis ? (
              <div className="card" style={{padding:13,borderColor:"rgba(96,165,250,.28)"}}>
                <div style={{fontSize:9,color:"#60a5fa",letterSpacing:1.5,textTransform:"uppercase",fontWeight:700,marginBottom:5}}>💼 Bester Arbeitspreis</div>
                <div className="price-tag" style={{fontSize:21,fontWeight:700,color:"#60a5fa"}}>{cheapA.preis.toFixed(3)}€</div>
                <div style={{fontSize:10,color:"#64748b",marginTop:2}}>{cheapA.name}</div>
              </div>
            ) : (
              <div className="card" style={{padding:13,opacity:.38}}>
                <div style={{fontSize:9,color:"#475569",letterSpacing:1.5,textTransform:"uppercase",fontWeight:700,marginBottom:5}}>💼 Crailsheim</div>
                <div style={{fontSize:11,color:"#475569"}}>Wochenende</div>
              </div>
            )}
          </div>

          {/* Heimat */}
          <div style={{marginBottom:20}}>
            <div className="slabel"><span>🏠 Heimat · Steinbach am Wald / Stimpfach</span></div>
            {heimat.map(s=><SRow key={s.id} s={s} best={cheapH?.id===s.id} onClick={()=>openSingle(s)}/>)}
          </div>

          {/* Dinkelsbühl */}
          <div style={{marginBottom:20}}>
            <div className="slabel" style={{color:"#fb923c"}}><span>🏙️ Dinkelsbühl</span></div>
            {dinkel&&<SRow s={dinkel} best={false} onClick={()=>openSingle(dinkel)} extra="dinkel"/>}
          </div>

          {/* Arbeitsweg */}
          <div>
            <div className="slabel" style={{color:isWorkday?"#60a5fa":"#334155"}}>
              <span style={{opacity:isWorkday?1:.5}}>💼 Arbeitsweg · Crailsheim (Mo–Fr)</span>
              {!isWorkday&&<span className="badge" style={{background:"rgba(255,255,255,.03)",color:"#475569",border:"1px solid rgba(255,255,255,.08)"}}>Wochenende</span>}
            </div>
            {arbeit.map(s=><SRow key={s.id} s={s} best={isWorkday&&cheapA?.id===s.id} onClick={()=>openSingle(s)} dimmed={!isWorkday}/>)}
            {isWorkday&&(
              <div style={{marginTop:7,padding:"9px 13px",background:"rgba(96,165,250,.06)",border:"1px solid rgba(96,165,250,.15)",borderRadius:10,fontSize:12,color:"#60a5fa"}}>
                💡 Tipp: 15–18 Uhr tanken spart oft ein paar Cent!
              </div>
            )}
          </div>

          <div style={{marginTop:20,fontSize:10,color:"#334155",textAlign:"center"}}>
            Preise via Tankerkönig · {KRAFTSTOFF_LABEL[kst]} · Auf Tankstelle tippen für Verlauf
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
